name: Vercel recover

# Runs the Vercel CLI from a GitHub runner, which (unlike the dev sandbox,
# where api.vercel.com is blocked by the network policy) can reach Vercel.
# Lets a session diagnose and repair the production deployment without the
# owner having to navigate the dashboard.
#
# Requires repository secret VERCEL_TOKEN (vercel.com/account/tokens).
#
# Triggered by editing ops/recover.trigger — its first line is the mode:
#   diagnose  → read-only: who am I, which projects, domains, deployments
#   recover   → build + deploy to production, then attach both domains

on:
  push:
    paths: ["ops/recover.trigger"]
  workflow_dispatch:
    inputs:
      mode:
        description: "diagnose or recover"
        required: true
        default: diagnose

jobs:
  vercel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve mode
        id: mode
        run: |
          if [ -n "${{ github.event.inputs.mode }}" ]; then
            m="${{ github.event.inputs.mode }}"
          else
            m=$(head -n1 ops/recover.trigger | tr -d '[:space:]')
          fi
          echo "mode=$m" >> "$GITHUB_OUTPUT"
          echo "Mode: $m"

      - name: Check token present
        env:
          T: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$T" ]; then
            echo "::error::VERCEL_TOKEN secret is not set. Create a token at https://vercel.com/account/tokens (scope: Full Account), then add it at Settings → Secrets and variables → Actions → New repository secret, name VERCEL_TOKEN."
            exit 1
          fi
          echo "Token present."

      - name: Diagnose
        env:
          T: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set +e
          echo "::group::whoami"; npx --yes vercel@latest whoami --token "$T"; echo "::endgroup::"
          echo "::group::teams";  npx --yes vercel@latest teams ls   --token "$T"; echo "::endgroup::"
          echo "::group::projects"; npx --yes vercel@latest project ls --token "$T"; echo "::endgroup::"
          echo "::group::domains";  npx --yes vercel@latest domains ls --token "$T"; echo "::endgroup::"
          exit 0

      # Compact, evidence-first probe: the x-vercel-error header names the
      # real failure (DEPLOYMENT_NOT_FOUND vs DNS_HOSTNAME_NOT_FOUND vs …),
      # which the build log never shows.
      - name: Probe — headers, DNS, domain config, production deployments
        if: steps.mode.outputs.mode == 'probe'
        env:
          T: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set +e
          for u in https://aifitnessapi.com/ https://www.aifitnessapi.com/ https://aifitnessapi.vercel.app/; do
            echo "--- $u"
            curl -sI --max-time 25 "$u" | grep -iE "^(HTTP/|location|x-vercel-error|x-vercel-id|server):"
          done
          echo "--- DNS"
          getent hosts aifitnessapi.com www.aifitnessapi.com
          echo "--- project domains"
          curl -s -H "Authorization: Bearer $T" \
            "https://api.vercel.com/v9/projects/aifitnessapi/domains" \
            | jq -c '.domains[]? | {name,verified,redirect,gitBranch,apexName}'
          echo "--- newest production deployments"
          curl -s -H "Authorization: Bearer $T" \
            "https://api.vercel.com/v6/deployments?app=aifitnessapi&target=production&limit=3" \
            | jq -c '.deployments[]? | {url,state,readyState,created}'
          exit 0

      - name: Recover — show full domain config (incl. gitBranch)
        if: steps.mode.outputs.mode == 'recover'
        env:
          T: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set +e
          for p in aifitnessapi aifitnessapi-nw4d; do
            echo "::group::domains on project $p"
            curl -s -H "Authorization: Bearer $T" \
              "https://api.vercel.com/v9/projects/$p/domains" \
              | jq -r 'if .domains then (.domains[]? | "\(.name)  verified=\(.verified)  redirect=\(.redirect)  gitBranch=\(.gitBranch)") else .error.message end'
            echo "::endgroup::"
          done
          exit 0

      # A domain pinned to a git branch that no longer exists serves
      # DEPLOYMENT_NOT_FOUND even though the project has healthy production
      # builds. Clearing gitBranch points it back at production. Apex serves,
      # www 308s to it (matching our canonicals; platform level only, because
      # an app-level host redirect once fought this and caused a loop).
      - name: Recover — repoint domains at production
        if: steps.mode.outputs.mode == 'recover'
        env:
          T: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set +e
          echo "::group::apex → serve production"
          curl -s -X PATCH -H "Authorization: Bearer $T" -H "Content-Type: application/json" \
            -d '{"gitBranch":null,"redirect":null}' \
            "https://api.vercel.com/v9/projects/aifitnessapi/domains/aifitnessapi.com" | jq -r '.name // .error.message'
          echo "::endgroup::"
          echo "::group::www → 308 to apex"
          curl -s -X PATCH -H "Authorization: Bearer $T" -H "Content-Type: application/json" \
            -d '{"gitBranch":null,"redirect":"aifitnessapi.com","redirectStatusCode":308}' \
            "https://api.vercel.com/v9/projects/aifitnessapi/domains/www.aifitnessapi.com" | jq -r '.name // .error.message'
          echo "::endgroup::"
          echo "::group::mapping after repoint"
          curl -s -H "Authorization: Bearer $T" \
            "https://api.vercel.com/v9/projects/aifitnessapi/domains" \
            | jq -r '.domains[]? | "\(.name)  verified=\(.verified)  redirect=\(.redirect)  gitBranch=\(.gitBranch)"'
          echo "::endgroup::"
          echo "::group::does apex serve now?"
          for i in 1 2 3 4 5 6; do
            code=$(curl -sL -o /dev/null -w "%{http_code}" --max-time 25 https://aifitnessapi.com/)
            echo "attempt $i: $code"; [ "$code" = "200" ] && break; sleep 10
          done
          echo "::endgroup::"
          exit 0

      # aifitnessapi.vercel.app — Vercel's own URL, no DNS involved — also
      # returns x-vercel-error: NOT_FOUND while deployments sit READY. That
      # means the deployments contain no routable output, which is what a
      # wrong Root/Output Directory produces: builds "succeed" and ship
      # nothing. Print the build settings, then clear them.
      - name: Recover — inspect and repair project build settings
        if: steps.mode.outputs.mode == 'recover'
        env:
          T: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set +e
          echo "::group::settings before"
          curl -s -H "Authorization: Bearer $T" "https://api.vercel.com/v9/projects/aifitnessapi" \
            | jq -c '{rootDirectory,outputDirectory,framework,buildCommand,installCommand,nodeVersion,publicSource}'
          echo "::endgroup::"
          echo "::group::reset to repo root + Next.js defaults"
          curl -s -X PATCH -H "Authorization: Bearer $T" -H "Content-Type: application/json" \
            -d '{"rootDirectory":null,"outputDirectory":null,"buildCommand":null,"installCommand":null,"framework":"nextjs"}' \
            "https://api.vercel.com/v9/projects/aifitnessapi" \
            | jq -c '{rootDirectory,outputDirectory,framework,buildCommand,installCommand} // .error'
          echo "::endgroup::"
          exit 0

      - name: Recover — deploy latest main to production
        if: steps.mode.outputs.mode == 'recover'
        env:
          T: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -e
          # --scope is required: this account has more than one team, and the
          # CLI refuses to auto-select one without a TTY.
          # Build on Vercel (no --prebuilt): the previous prebuilt upload was
          # 5.6 KB for a 206-page site, i.e. it shipped an empty output tree.
          S="--scope nikitastarovzz"
          npx --yes vercel@latest link --yes --project aifitnessapi $S --token "$T"
          npx --yes vercel@latest deploy --prod --yes $S --token "$T" | tee /tmp/deploy.txt

      - name: Verify live site
        if: steps.mode.outputs.mode == 'recover'
        run: |
          set +e
          for i in 1 2 3 4 5 6 7 8; do
            v=$(curl -s -o /dev/null -w "%{http_code}" --max-time 25 https://aifitnessapi.vercel.app/)
            a=$(curl -sL -o /dev/null -w "%{http_code}" --max-time 25 https://aifitnessapi.com/)
            echo "attempt $i: vercel.app -> $v   apex -> $a"
            [ "$a" = "200" ] && { echo "RECOVERED"; exit 0; }
            sleep 20
          done
          curl -sI --max-time 25 https://aifitnessapi.com/ | grep -iE "^(HTTP/|x-vercel-error):"
          echo "::warning::apex still not 200"
