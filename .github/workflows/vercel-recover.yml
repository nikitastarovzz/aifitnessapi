name: Vercel recover

# Runs the Vercel CLI from a GitHub runner, which (unlike the dev sandbox,
# where api.vercel.com is blocked by the network policy) can reach Vercel.
# Lets a session diagnose and repair the production deployment without the
# owner having to navigate the dashboard.
#
# Requires repository secret VERCEL_TOKEN (vercel.com/account/tokens).
#
# Triggered by editing ops/recover.trigger — its first line is the mode:
#   diagnose  → read-only: who am I, which projects, domains, deployments
#   recover   → build + deploy to production, then attach both domains

on:
  push:
    paths: ["ops/recover.trigger"]
  workflow_dispatch:
    inputs:
      mode:
        description: "diagnose or recover"
        required: true
        default: diagnose

jobs:
  vercel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve mode
        id: mode
        run: |
          if [ -n "${{ github.event.inputs.mode }}" ]; then
            m="${{ github.event.inputs.mode }}"
          else
            m=$(head -n1 ops/recover.trigger | tr -d '[:space:]')
          fi
          echo "mode=$m" >> "$GITHUB_OUTPUT"
          echo "Mode: $m"

      - name: Check token present
        env:
          T: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$T" ]; then
            echo "::error::VERCEL_TOKEN secret is not set. Create a token at https://vercel.com/account/tokens (scope: Full Account), then add it at Settings → Secrets and variables → Actions → New repository secret, name VERCEL_TOKEN."
            exit 1
          fi
          echo "Token present."

      - name: Diagnose
        env:
          T: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set +e
          echo "::group::whoami"; npx --yes vercel@latest whoami --token "$T"; echo "::endgroup::"
          echo "::group::teams";  npx --yes vercel@latest teams ls   --token "$T"; echo "::endgroup::"
          echo "::group::projects"; npx --yes vercel@latest project ls --token "$T"; echo "::endgroup::"
          echo "::group::domains";  npx --yes vercel@latest domains ls --token "$T"; echo "::endgroup::"
          exit 0

      - name: Recover — show current domain→project mapping
        if: steps.mode.outputs.mode == 'recover'
        env:
          T: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set +e
          for p in aifitnessapi aifitnessapi-nw4d; do
            echo "::group::domains on project $p"
            curl -s -H "Authorization: Bearer $T" \
              "https://api.vercel.com/v9/projects/$p/domains" \
              | jq -r 'if .domains then (.domains[]? | "\(.name)  verified=\(.verified)  redirect=\(.redirect)") else .error.message end'
            echo "::endgroup::"
          done
          exit 0

      - name: Recover — deploy latest main to production
        if: steps.mode.outputs.mode == 'recover'
        env:
          T: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -e
          npx --yes vercel@latest link --yes --project aifitnessapi --token "$T"
          npx --yes vercel@latest pull --yes --environment=production --token "$T"
          npx --yes vercel@latest build --prod --token "$T"
          npx --yes vercel@latest deploy --prebuilt --prod --yes --token "$T" | tee /tmp/deploy.txt

      - name: Recover — attach apex + www to the aifitnessapi project
        if: steps.mode.outputs.mode == 'recover'
        env:
          T: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set +e
          # Free the domains from the duplicate project if they are stuck there.
          for d in aifitnessapi.com www.aifitnessapi.com; do
            curl -s -X DELETE -H "Authorization: Bearer $T" \
              "https://api.vercel.com/v9/projects/aifitnessapi-nw4d/domains/$d" -o /dev/null -w "detach $d from nw4d: %{http_code}\n"
          done
          # Apex serves the site; www 308-redirects to it (platform level only —
          # an app-level host redirect once fought this and caused a loop).
          echo "::group::attach apex"
          curl -s -X POST -H "Authorization: Bearer $T" -H "Content-Type: application/json" \
            -d '{"name":"aifitnessapi.com"}' \
            "https://api.vercel.com/v10/projects/aifitnessapi/domains"
          echo; echo "::endgroup::"
          echo "::group::attach www (redirect to apex)"
          curl -s -X POST -H "Authorization: Bearer $T" -H "Content-Type: application/json" \
            -d '{"name":"www.aifitnessapi.com","redirect":"aifitnessapi.com","redirectStatusCode":308}' \
            "https://api.vercel.com/v10/projects/aifitnessapi/domains"
          echo; echo "::endgroup::"
          echo "::group::final mapping"
          curl -s -H "Authorization: Bearer $T" \
            "https://api.vercel.com/v9/projects/aifitnessapi/domains" -o /tmp/domains.json
          jq -r '.domains[]? | "\(.name)  verified=\(.verified)  redirect=\(.redirect)"' /tmp/domains.json
          echo "::endgroup::"
          exit 0

      - name: Verify live site
        if: steps.mode.outputs.mode == 'recover'
        run: |
          set +e
          for i in 1 2 3 4 5 6; do
            code=$(curl -sL -o /dev/null -w "%{http_code}" --max-time 25 https://aifitnessapi.com/)
            echo "attempt $i: apex -> $code"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          echo "::warning::apex still not 200 — see domain output above"
