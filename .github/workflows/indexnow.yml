# Pings IndexNow (Bing, Yandex, etc.) with the URLs that changed in the live
# sitemap, so new and updated pages get crawled fast. Google ignores IndexNow —
# that side is covered by the sitemap submitted in Search Console.
#
# When it runs:
#   - after every successful Production deploy (Vercel reports a GitHub
#     deployment status) — diff mode, the normal path;
#   - on every push to the default branch, after waiting for that commit's
#     deploy — diff mode, and the path that does not depend on the
#     Vercel↔GitHub integration still reporting deployment statuses;
#   - Mondays, as a diff catch-up for anything a deploy-time run missed;
#   - on demand from the Actions tab: mode "diff", or "all" to resubmit every
#     sitemap URL — for one-offs such as the resubmission after an outage.
#   - automatically in "all" mode once, when uptime.yml sees the site recover
#     from an outage: every URL was served an error, so every URL needs
#     re-announcing, not just the ones whose lastmod moved.
#
# Nothing here is a manual step. `npm run indexnow` still exists for a local
# dry run (`-- --dry-run`), but no announcement depends on someone remembering
# to run it.
#
# Diff mode compares the sitemap with the snapshot the last accepted run left;
# scripts/indexnow.mjs says exactly what it submits. The snapshot lives in the
# Actions cache, not the repo: committing it would trigger a deploy, which
# would trigger this workflow.
#
# A sitemap that does not return 200 fails the job. That is deliberate — it is
# the alert that the deploy this run was reacting to is not actually serving.
#
# No secrets: the IndexNow key is public by design (it is served from
# public/<key>.txt on the site itself).
name: indexnow
on:
  deployment_status:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "diff = only what changed since the last accepted run; all = every sitemap URL"
        type: choice
        options: [diff, all]
        default: diff
      paths:
        description: "Optional: space-separated paths to submit instead (e.g. /fix /pricing/strava-api-pricing). For pages whose title or copy changed without a new lastmod, which diff mode cannot see. Leaves the snapshot alone."
        type: string
        required: false
        default: ""
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC — diff catch-up

jobs:
  # Vercel's deployment events carry the commit SHA as their ref, so a run they
  # start has an empty GITHUB_REF, and actions/cache skips both restore and
  # save without a branch ref. That would make every deploy-time run a first
  # run. So a successful Production deploy only dispatches this workflow on the
  # default branch, where the cache works; workflow_dispatch is one of the
  # events GITHUB_TOKEN is allowed to trigger.
  #
  # Vercel also reports Preview deploys and pending states; those runs show as
  # skipped. The environment test is a prefix match (case-insensitive, like
  # every string comparison in Actions expressions) so a project-suffixed
  # environment name would still count as Production.
  relay:
    if: >-
      github.event_name == 'deployment_status' &&
      github.event.deployment_status.state == 'success' &&
      startsWith(github.event.deployment.environment, 'production')
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch a diff run on the default branch
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: gh workflow run indexnow.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH" -f mode=diff

  submit:
    if: github.event_name != 'deployment_status'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: read # the push path waits for this commit's deploy
    # One submitter at a time, so each run diffs against the snapshot the one
    # before it saved. Job-level rather than workflow-level on purpose: a
    # workflow-level group would also hold the skipped Preview-deploy runs,
    # and a newer pending run in a group replaces an older pending one — a
    # preview could knock a real submission out of the queue. Here a newer
    # submit replacing an older pending one loses nothing, since the diff is
    # cumulative.
    concurrency:
      group: indexnow
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Each save gets a unique key (cache entries are immutable); restore
      # takes the newest entry by prefix. A miss — first run, or the entry was
      # evicted — falls back to the script's 7-day window, not to nothing.
      - name: Restore the last snapshot
        uses: actions/cache/restore@v4
        with:
          path: .indexnow/snapshot.json
          key: indexnow-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: indexnow-snapshot-

      # A push-triggered run starts the moment the commit lands, which is
      # before Vercel has finished building it. Diff mode reads the LIVE
      # sitemap, so without this wait the run would diff the previous deploy
      # and announce nothing.
      #
      # Belt and braces with the relay job above, on purpose. The relay is the
      # fast path and fires the instant the deploy is reported ready. This
      # path needs nothing from the Vercel↔GitHub integration except time, so
      # a push is still announced if deployment statuses stop arriving — the
      # state that would otherwise leave new URLs unannounced until Monday.
      # Whichever run gets there first does the work; the other finds nothing
      # changed and exits without touching the snapshot.
      #
      # Timing out is not a failure. Vercel deploys a push whether or not it
      # reports the status here, so after the grace period the live sitemap is
      # in all likelihood already the new one; and if it is not, the run
      # diffs the old one, submits nothing and leaves the snapshot in place,
      # so the change is still picked up by the next run.
      - name: Wait for this commit's Production deploy
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          # No pipe into grep anywhere here: jq answers true/false, because a
          # `gh api … | grep -q` pipeline exits non-zero under pipefail when
          # grep closes the pipe early, and would read as "not deployed".
          ready () {
            local id
            for id in $(gh api "repos/$GITHUB_REPOSITORY/deployments?sha=$SHA&per_page=100" \
                          --jq '.[] | select((.environment // "") | ascii_downcase | startswith("production")) | .id'); do
              if [ "$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses?per_page=100" \
                        --jq 'any(.[]; .state == "success")')" = "true" ]; then
                return 0
              fi
            done
            return 1
          }
          for attempt in $(seq 1 30); do
            if ready; then
              echo "Production deployment of $SHA reported ready after ~$(( (attempt - 1) * 30 ))s."
              exit 0
            fi
            sleep 30
          done
          echo "::notice::No successful Production deployment reported for $SHA after 15 minutes. Diffing the live sitemap as it stands."

      # Explicit paths go through an env var, never interpolated into the
      # script: a dispatch input is free text. Only path-shaped words are
      # passed on; anything else fails the step instead of being run.
      - name: Submit to IndexNow
        env:
          INDEXNOW_SNAPSHOT: .indexnow/snapshot.json
          MODE: ${{ inputs.mode }}
          PATHS: ${{ inputs.paths }}
        run: |
          set -euo pipefail
          if [ -n "${PATHS:-}" ]; then
            read -r -a list <<< "$PATHS"
            for p in "${list[@]}"; do
              [[ "$p" =~ ^/[a-z0-9/._-]*$ ]] || { echo "Not a site path: $p"; exit 1; }
            done
            node scripts/indexnow.mjs "${list[@]}"
          elif [ "${MODE:-diff}" = "all" ]; then
            node scripts/indexnow.mjs --all
          else
            node scripts/indexnow.mjs
          fi

      # Only reached when the script succeeded, i.e. IndexNow accepted the
      # batch or there was nothing to send. Re-saving an unchanged snapshot is
      # intended: it keeps the entry recently used, so it is not evicted
      # between weekly runs.
      - name: Save the snapshot
        if: hashFiles('.indexnow/snapshot.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .indexnow/snapshot.json
          key: indexnow-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
