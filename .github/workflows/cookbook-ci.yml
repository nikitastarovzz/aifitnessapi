name: cookbook-ci

# The Cookbook's contract: every recipe on aifitnessapi.com/cookbook is a
# byte-verbatim copy of a file in /cookbook that passes these tests. This
# workflow is what makes the pages' "CI-tested" claim true — it must stay
# green and must run on every change to the recipes.

on:
  push:
    branches: [main]
    paths: ["cookbook/**", ".github/workflows/cookbook-ci.yml", "src/lib/webhookVerifier.mjs", "src/lib/hrMeasurement.mjs", "src/data/bluetoothGatt.ts", "src/data/errorCodes.ts", "src/data/workoutTypes.ts", "public/datasets/workout-types-crosswalk-2026.json"]
  pull_request:
    # The recipe suites also read the site data they were written from.
    paths: ["cookbook/**", ".github/workflows/cookbook-ci.yml", "src/lib/webhookVerifier.mjs", "src/lib/hrMeasurement.mjs", "src/data/bluetoothGatt.ts", "src/data/errorCodes.ts", "src/data/workoutTypes.ts", "public/datasets/workout-types-crosswalk-2026.json"]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test "cookbook/**/*.test.mjs"
