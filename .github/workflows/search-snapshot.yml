name: Weekly search snapshot

# The weekly Google + Bing pull, on a schedule (ops/NEXT-10-2026-11-04.md
# item 3). Runs scripts/search-pull.mjs, which writes data/gsc/latest.json,
# data/gsc/snapshots/<date>.json, data/gsc/bing-latest.json and
# ops/gsc/bing-<date>.csv, then opens a pull request with them that merges
# itself once CI is green. The weekly health checks from
# scripts/gsc-report.mjs go to the run's job summary.
#
# Why the six earlier runs failed (all six, 2026-10-02 → 10-05):
#   - Runs 1-5 (push events) created no jobs: the workflow file did not parse.
#     A continuation line of a multi-line commit message sat at column 0 and
#     ended the `run: |` block scalar. Fixed before run 6 with two `-m`
#     arguments (kept below).
#   - Run 6 (the 10-05 schedule) pinned the snapshot and pushed its branch,
#     then `gh pr create` failed with "GitHub Actions is not permitted to
#     create or approve pull requests (createPullRequest)". That is a
#     repository setting, not something this file can change (see SETUP).
#   - Separately, the old job never fetched anything: it re-pinned whatever
#     data/gsc/latest.json already held, because the pull needed a credential
#     only the aifitnessapi cloud environment's proxy supplies.
#
# SETUP (owner, once). Without the two secrets the run skips with a notice
# and succeeds, so a missing credential never emails a failure.
#   1. Repository secret GSC_SERVICE_ACCOUNT_JSON: the JSON key of a Google
#      Cloud service account (raw JSON, or base64 of it) with the Search
#      Console API enabled in its project, added as a Restricted user of the
#      sc-domain:aifitnessapi.com property in Search Console (Settings →
#      Users and permissions → Add user → the account's client_email).
#   2. Repository secret BING_WEBMASTER_API_KEY: the Bing Webmaster Tools API
#      key, the same one the cloud environment uses.
#   3. Settings → Actions → General → Workflow permissions: tick "Allow
#      GitHub Actions to create and approve pull requests". Every bot
#      workflow here opens its PR this way and fails without it.
#
# The secrets reach only the pull step's environment; search-pull.mjs never
# prints the key, the token or the Bing key.

on:
  schedule:
    - cron: "41 6 * * 1" # Mondays 06:41 UTC; the window ends three days earlier
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  # To dispatch ci.yml on the bot branch (see the last step).
  actions: write

concurrency:
  group: search-snapshot
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check the credentials are configured
        id: creds
        env:
          GSC: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          BING: ${{ secrets.BING_WEBMASTER_API_KEY }}
        run: |
          missing=""
          [ -n "$GSC" ] || missing="GSC_SERVICE_ACCOUNT_JSON"
          [ -n "$BING" ] || missing="${missing:+$missing and }BING_WEBMASTER_API_KEY"
          if [ -n "$missing" ]; then
            echo "::notice title=Search pull skipped::Repository secret ${missing} is not set, so there is nothing to authenticate with. See the SETUP comment at the top of .github/workflows/search-snapshot.yml."
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=0" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.creds.outputs.skip == '0'

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.skip == '0'
        with:
          node-version: "22"

      - name: Pull Google Search Console and Bing
        if: steps.creds.outputs.skip == '0'
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
        # Exits non-zero and writes nothing on a refused credential or a short
        # read (fewer than 50 Google page rows), so a bad pull never lands.
        run: node scripts/search-pull.mjs

      - name: Weekly health checks to the job summary
        if: steps.creds.outputs.skip == '0'
        # No build here, so the index-lag check reports that it needs one.
        run: |
          set -o pipefail
          node scripts/gsc-report.mjs > "$RUNNER_TEMP/report.txt"
          {
            echo '### Weekly health checks'
            echo '```text'
            sed -n '/^Weekly health checks/,$p' "$RUNNER_TEMP/report.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open a pull request with the pull
        if: steps.creds.outputs.skip == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git add data/gsc/latest.json data/gsc/bing-latest.json data/gsc/snapshots/ ops/gsc/
          if git diff --cached --quiet; then
            echo "The pull matches what main already holds — nothing to commit."
            exit 0
          fi
          stamp=$(date -u +%Y-%m-%d)
          window=$(node -e "const r=JSON.parse(require('fs').readFileSync('data/gsc/latest.json','utf8')).range; console.log(r.start+' to '+r.end)")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Two -m arguments, not a multi-line string: a continuation line at
          # column 0 ends the `run: |` block scalar and the whole workflow
          # stops parsing. That shipped once and five runs failed with no jobs.
          git commit -m "Search pull ${stamp}: Google and Bing, ${window}" \
            -m "Automated by .github/workflows/search-snapshot.yml (scripts/search-pull.mjs). Compare with: npm run gsc -- --compare <date>."

          # PR + auto-merge rather than a direct push: main requires a pull
          # request and the gates check. Data-only, so it is green and merges
          # itself within minutes.
          branch="bot/search-pull-${stamp}-${GITHUB_RUN_ID}"
          git checkout -b "$branch"
          git push origin "$branch"
          if ! out=$(gh pr create --base main --head "$branch" \
              --title "Search pull ${stamp}: Google and Bing, ${window}" \
              --body "Weekly Search Console and Bing pull (scripts/search-pull.mjs). The weekly health checks are in the run summary: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Merges itself once CI is green." 2>&1); then
            echo "$out"
            if printf '%s' "$out" | grep -q "not permitted to create or approve pull requests"; then
              echo "::error title=Repository setting needed::Settings → Actions → General → Workflow permissions → tick 'Allow GitHub Actions to create and approve pull requests'. The pull is on branch ${branch}; open its PR by hand this once."
            fi
            exit 1
          fi
          echo "$out"
          gh pr merge --auto --squash --delete-branch "$branch"

          # A pull request opened with GITHUB_TOKEN does not start ci.yml on
          # its own (GitHub suppresses events from that token, except
          # workflow_dispatch and repository_dispatch), so the required
          # `gates` check would never report and auto-merge would wait
          # forever. Dispatching CI on the branch runs `gates` on the PR's
          # head commit.
          gh workflow run ci.yml --ref "$branch"
