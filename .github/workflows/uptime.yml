name: Uptime check

# Tripwire for aifitnessapi.com. Probes the production site from GitHub's
# runners (which, unlike our dev environment, can reach it), fails loudly,
# and manages a "site-down" issue so the owner gets notified immediately.
# Added 2026-08-05 after a Vercel domain misconfiguration served a platform
# 404 on the apex host with nothing watching.

on:
  schedule:
    - cron: "17,47 * * * *" # every 30 min, off the top-of-hour rush
  workflow_dispatch: {}
  push:
    branches: [main] # also probe right after every deploy-triggering push

concurrency:
  group: uptime
  cancel-in-progress: false

permissions:
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      # Ask the edge what is actually wrong before guessing. Vercel states the
      # reason in x-vercel-error; on 2026-09-27 the site went to
      # 402 DEPLOYMENT_DISABLED and stayed there five days, because the issue
      # body below listed three causes and none of them was the real one.
      - name: Classify the failure
        id: diag
        run: |
          set -uo pipefail
          hdrs=$(curl -sSI --max-time 25 https://aifitnessapi.com/ || true)
          code=$(printf '%s' "$hdrs" | awk 'NR==1{print $2}')
          verr=$(printf '%s' "$hdrs" | tr -d '\r' | awk -F': ' 'tolower($1)=="x-vercel-error"{print $2}')
          echo "status=${code:-000}" >> "$GITHUB_OUTPUT"
          echo "vercel_error=${verr:-none}" >> "$GITHUB_OUTPUT"
          echo "apex: HTTP ${code:-000}  x-vercel-error: ${verr:-none}"

      - name: Probe production
        id: core
        run: |
          set -euo pipefail
          fail=0
          # Retry to absorb deploy propagation: this workflow also runs on
          # push, so a probe can race Vercel finishing the build. A real
          # outage still alerts, roughly a minute later.
          check () { # url, expected substring ("" = status only)
            local url="$1" needle="$2" code attempt
            for attempt in 1 2 3 4; do
              code=$(curl -sL -o /tmp/body -w "%{http_code}" --max-time 25 "$url" || echo "000")
              if [ "$code" = "200" ]; then
                if [ -z "$needle" ] || grep -q "$needle" /tmp/body; then
                  echo "$url -> $code ok"; return
                fi
              fi
              if [ "$attempt" -lt 4 ]; then sleep 20; fi
            done
            echo "$url -> $code FAILED (needle: ${needle:-none})"; fail=1
          }
          check "https://aifitnessapi.com/"            "AIFitnessAPI"
          check "https://www.aifitnessapi.com/"        "AIFitnessAPI"
          check "https://aifitnessapi.com/fix"         "fitness API"
          check "https://aifitnessapi.com/llms.txt"    "AIFitnessAPI"
          check "https://aifitnessapi.com/sitemap.xml" "aifitnessapi.com"
          exit $fail

      - name: Probe GEO surfaces
        id: geo
        if: always()
        run: |
          set -euo pipefail
          fail=0
          check () { # url, expected substring ("" = status only)
            local url="$1" needle="$2" code attempt
            for attempt in 1 2 3 4; do
              code=$(curl -sL -o /tmp/body -w "%{http_code}" --max-time 25 "$url" || echo "000")
              if [ "$code" = "200" ]; then
                if [ -z "$needle" ] || grep -q "$needle" /tmp/body; then
                  echo "$url -> $code ok"; return
                fi
              fi
              if [ "$attempt" -lt 4 ]; then sleep 20; fi
            done
            echo "$url -> $code FAILED (needle: ${needle:-none})"; fail=1
          }

          # Machine-readable surfaces (ops/GEO.md). These are invisible to
          # humans, so nothing but this job would notice them breaking.
          check "https://aifitnessapi.com/answers.json" '"answers"'
          check "https://aifitnessapi.com/changes.xml"  "<item>"
          check "https://aifitnessapi.com/changes/calendar.ics"  "BEGIN:VCALENDAR"
          check "https://aifitnessapi.com/badges/healthkit-types.svg"  "HealthKit types"
          check "https://aifitnessapi.com/badges/last-verified.svg"    "last verified"
          check "https://aifitnessapi.com/healthkit-identifiers"  "HKQuantityTypeIdentifier"
          check "https://aifitnessapi.com/healthkit-errors"       "errorAuthorizationDenied"
          check "https://aifitnessapi.com/kit/healthkit-type-identifiers-2026.csv" "identifier"
          check "https://aifitnessapi.com/robots.txt"   "Claude-SearchBot"
          check "https://aifitnessapi.com/llms-full.txt" "AIFitnessAPI"

          # Markdown mirrors at the llms.txt-conventional addresses, which are
          # served by rewrites — the part most likely to break silently.
          check "https://aifitnessapi.com/index.md"     "AIFitnessAPI"
          check "https://aifitnessapi.com/devices.md"   "Connected Devices"
          check "https://aifitnessapi.com/devices/ftms-fitness-machine-service.md" 'canonical: "https://'

          # Surfaces added 2026-08-22. Same reasoning: a feed, a dataset or the
          # directory can 404 in production without a single human noticing.
          check "https://aifitnessapi.com/apis"                    "API directory"
          check "https://aifitnessapi.com/datasets"                "CC BY"
          check "https://aifitnessapi.com/feeds/devices.xml"       "<item>"
          check "https://aifitnessapi.com/feed.json"               "jsonfeed.org"
          check "https://aifitnessapi.com/opensearch.xml"          "OpenSearchDescription"
          check "https://aifitnessapi.com/manifest.webmanifest"    "start_url"
          check "https://aifitnessapi.com/.well-known/security.txt" "Contact:"
          check "https://aifitnessapi.com/datasets/fitness-api-changes-2026.json" '"items"'

          # answers.json must stay in step with the site, not drift to an
          # empty or truncated index.
          count=$(curl -sL --max-time 25 https://aifitnessapi.com/answers.json \
            | python3 -c "import json,sys; print(len(json.load(sys.stdin)['answers']))" || echo 0)
          echo "answers.json records: $count"
          if [ "$count" -lt 200 ]; then echo "answers.json too small"; fail=1; fi

          # Discovery relations must survive in the HTML and the headers.
          hdrs=$(curl -sSL -D - -o /dev/null --max-time 25 \
            https://aifitnessapi.com/devices/ftms-fitness-machine-service || true)
          echo "$hdrs" | grep -qi 'rel="alternate"' || { echo "missing Link rel=alternate"; fail=1; }
          echo "$hdrs" | grep -qi 'rel="describedby"' || { echo "missing Link rel=describedby"; fail=1; }
          exit $fail

      - name: Probe signup storage
        id: signup
        if: always()
        run: |
          set -euo pipefail
          # The only part of this site that can fail invisibly: the form still
          # renders and "succeeds" client-side while the API drops the lead.
          body=$(curl -sL --max-time 25 https://aifitnessapi.com/api/signup/health || echo '{}')
          code=$(curl -sL -o /dev/null -w "%{http_code}" --max-time 25 \
            https://aifitnessapi.com/api/signup/health || echo 000)
          echo "health endpoint -> $code"
          echo "$body"
          if [ "$code" != "200" ]; then
            echo "SIGNUP STORAGE IS NOT WORKING — submissions are not being stored."
            exit 1
          fi

      - name: Open or update site-down issue
        if: failure()
        uses: actions/github-script@v7
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
        with:
          script: |
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "site-down",
            });
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const status = "${{ steps.diag.outputs.status }}";
            const vercelError = "${{ steps.diag.outputs.vercel_error }}";
            // Platform states Vercel names explicitly. Each one has exactly
            // one fix and it is never "redeploy".
            const PLATFORM = {
              DEPLOYMENT_DISABLED:
                "**Vercel has disabled this project's deployments.** This is an account state, not a code or DNS problem — redeploying will not clear it. It is almost always a spend limit reached or a payment method that failed. Vercel dashboard → the account → Settings → Billing: clear the outstanding state, then Settings → the aifitnessapi project → re-enable deployments. Nothing in this repo can fix it.",
              DEPLOYMENT_PAUSED:
                "**The deployment is paused.** Vercel dashboard → the aifitnessapi project → Settings → resume the deployment.",
              DEPLOYMENT_BLOCKED:
                "**The deployment is blocked by Vercel.** Check the account's notifications for the reason; this is an account-level action.",
              DEPLOYMENT_NOT_FOUND:
                "**No deployment is serving this domain.** Deployments tab: the latest must be Ready and Current for Production.",
              DNS_HOSTNAME_NOT_FOUND:
                "**DNS is not resolving to Vercel.** Settings → Domains, and the registrar's records.",
            };
            const platformHint = PLATFORM[vercelError];
            const coreDown = "${{ steps.core.outcome }}" === "failure";
            const geoDown = "${{ steps.geo.outcome }}" === "failure";
            const signupDown = "${{ steps.signup.outcome }}" === "failure";
            const title = coreDown
              ? `🔴 aifitnessapi.com is DOWN — HTTP ${status}${vercelError && vercelError !== "none" ? ` ${vercelError}` : ""}`
              : geoDown
                ? "🟠 aifitnessapi.com is up, but GEO surfaces are broken"
                : "🟡 Signups are not being stored";
            const signupBody = [
              "`/api/signup/health` did not return 200, which means a person who fills in the form gets a 503 and the lead is lost. The site itself is fine.",
              "",
              "The endpoint reports why in its `detail` field — see the **Probe signup storage** step output. The two usual causes:",
              "",
              "1. **Credentials missing** — `FIREBASE_PROJECT_ID`, `FIREBASE_CLIENT_EMAIL` and `FIREBASE_PRIVATE_KEY` must all be set in Vercel → the aifitnessapi project → Settings → Environment Variables, for the Production environment, followed by a redeploy.",
              "2. **Credentials present but rejected** — usually the private key lost its newlines when pasted, or the service account belongs to a different project than `FIREBASE_PROJECT_ID`.",
              "",
              `Failing run: ${runUrl}`,
            ].join("\n");
            const body = signupDown && !coreDown && !geoDown
              ? signupBody
              : coreDown
              ? [
                  `Apex returned **HTTP ${status}**${vercelError && vercelError !== "none" ? ` with \`x-vercel-error: ${vercelError}\`` : ""}.`,
                  "",
                  ...(platformHint ? [platformHint, ""] : []),
                  ...(platformHint ? [] : ["The scheduled uptime probe failed. Most likely causes, in order:", ""]),
                  "",
                  ...(platformHint ? [] : [
                    "1. **Vercel domain detached** — Vercel dashboard → the aifitnessapi project → Settings → Domains: `aifitnessapi.com` must be listed and assigned to Production (no custom branch); `www.aifitnessapi.com` should redirect to it.",
                    "2. **No production deployment** — Deployments tab: the latest deployment must be **Ready** and marked **Current** for Production. If none is, `Redeploy` the latest ready build.",
                    "3. **Failed deploy of a new commit** — open the newest deployment's build logs.",
                    "",
                  ]),
                  "Every hour this stays up, Googlebot gets the same status. Sustained 4xx is a removal signal, not a retry signal — unlike a 503, which asks it to come back.",
                  "",
                  `Failing run: ${runUrl}`,
                ].join("\n")
              : [
                  "Pages are serving, but one or more machine-readable surfaces failed (see the **Probe GEO surfaces** step for which).",
                  "",
                  "These are invisible to humans, so nothing else would catch it. Likely causes:",
                  "",
                  "1. **A `.md` address 404s** — the rewrites in `next.config.ts` map `/<cluster>/<slug>.md` onto the `/md/*` generator. A new cluster must be added to the `CLUSTERS` list there (`npm run qa` gates this locally).",
                  "2. **A route stopped building** — `answers.json`, `changes.xml`, `llms.txt` or `robots.txt` missing from the deploy.",
                  "3. **Link headers dropped** — the `headers()` block in `next.config.ts`.",
                  "",
                  "Rules and rationale: `ops/GEO.md`.",
                  "",
                  `Failing run: ${runUrl}`,
                ].join("\n");
            let issue = open[0];
            let hoursDown = 0;
            if (!issue) {
              const created = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, labels: ["site-down"], body,
              });
              issue = created.data;
            } else {
              hoursDown = (Date.now() - new Date(issue.created_at).getTime()) / 3.6e6;
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                body: `Still failing after ${hoursDown.toFixed(0)}h: ${runUrl}`,
              });
              // Keep the title honest about the cause and the age. A title
              // that still says "uptime check failed" on day five understates
              // it every time someone glances at the issue list.
              const wanted = `${title} — ${hoursDown < 24 ? `${Math.floor(hoursDown)}h` : `${Math.floor(hoursDown / 24)}d`} and counting`;
              if (issue.title !== wanted) {
                await github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: issue.number, title: wanted,
                });
              }
            }

            // Escalate by email. An open issue is a passive signal: #7 was
            // opened correctly on 2026-09-27 and the site stayed down five
            // days. Fire on first detection and then at widening intervals,
            // so it is noticeable without becoming noise to filter away.
            if (!coreDown) return;
            const THRESHOLDS = [0, 6, 24, 72, 168];
            const crossed = THRESHOLDS.some((t) => hoursDown >= t && hoursDown < t + 0.6);
            const key = process.env.RESEND_API_KEY;
            const to = process.env.ALERT_EMAIL;
            if (!crossed) return;
            if (!key || !to) {
              core.warning(
                "Site is down and no email was sent: " +
                  (!key ? "RESEND_API_KEY secret missing. " : "") +
                  (!to ? "ALERT_EMAIL repository variable missing. " : "") +
                  "Set both so an outage reaches someone who is not reading the issue list.",
              );
              return;
            }
            const age = hoursDown < 1 ? "just now" : hoursDown < 24 ? `${Math.floor(hoursDown)} hours` : `${Math.floor(hoursDown / 24)} days`;
            const res = await fetch("https://api.resend.com/emails", {
              method: "POST",
              headers: { Authorization: `Bearer ${key}`, "Content-Type": "application/json" },
              body: JSON.stringify({
                from: "AIFitnessAPI alerts <hello@aifitnessapi.com>",
                to: [to],
                subject: `aifitnessapi.com is DOWN (${status}${vercelError !== "none" ? ` ${vercelError}` : ""}) — ${age}`,
                text: [
                  `aifitnessapi.com has been returning HTTP ${status} for ${age}.`,
                  vercelError !== "none" ? `Vercel reports: ${vercelError}` : "",
                  "",
                  platformHint ? platformHint.replace(/\*\*/g, "") : "See the issue for the runbook.",
                  "",
                  `Issue:  ${issue.html_url}`,
                  `Run:    ${runUrl}`,
                  "",
                  "Googlebot is getting the same status. A sustained 4xx is a removal signal.",
                ].filter(Boolean).join("\n"),
              }),
            });
            if (!res.ok) core.warning(`Resend returned ${res.status}: ${await res.text()}`);
            else core.notice(`Outage email sent to ${to}.`);

      - name: Auto-close site-down issue on recovery
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "site-down",
            });
            for (const issue of open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                body: "✅ All probes passing again — closing.",
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, state: "closed",
              });
            }
